<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peterson</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Peterson">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180x180.png">
  <link rel="icon" href="icons/favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/icon.svg" sizes="any" type="image/svg+xml">
  <meta name="theme-color" content="#1a1a2e">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sand:       #f5ede0;
      --terracotta: #c4663a;
      --ink:        #1a1a2e;
      --cream:      #fdf8f2;
      --paper:      #ffffff;
      --muted:      #8a7f74;
      --border:     #e6dccc;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── HERO ─────────────────────────────── */
    .hero {
      background: var(--ink);
      color: var(--sand);
      padding: 56px 32px 48px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 80% 20%, rgba(196,102,58,.32) 0%, transparent 55%),
        radial-gradient(ellipse at 12% 85%, rgba(196,102,58,.14) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-inner { position: relative; max-width: 560px; margin: 0 auto; }

    .hero-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--terracotta);
      margin-bottom: 14px;
    }

    .hero h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(36px, 8vw, 52px);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .hero-sub {
      font-size: 14px;
      color: #b0a898;
      line-height: 1.7;
      max-width: 400px;
    }

    /* ── BODY ─────────────────────────────── */
    .body {
      max-width: 560px;
      margin: 0 auto;
      padding: 40px 32px 64px;
    }

    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── CARDS ────────────────────────────── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 22px;
      text-decoration: none;
      color: var(--ink);
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .card:active { transform: scale(0.98); }

    @media (hover: hover) {
      .card:hover {
        box-shadow: 0 6px 24px rgba(26,26,46,0.08);
        border-color: #d8ccbc;
      }
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .card-body { flex: 1; min-width: 0; }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    .card-arrow {
      color: var(--muted);
      flex-shrink: 0;
      font-size: 18px;
    }

    /* card accent colors */
    .card-receitas  .card-icon { background: #fdf0e8; color: var(--terracotta); }
    .card-hsd       .card-icon { background: #e8f0f8; color: #3a7ca5; }
    .card-security  .card-icon { background: #e8f5f0; color: #2e8b65; }
  </style>
</head>
<body>

  <div class="hero">
    <div class="hero-inner">
      <p class="hero-label">Personal Projects</p>
      <h1>Peterson</h1>
      <p class="hero-sub">A collection of tools, references, and experiments.</p>
    </div>
  </div>

  <div class="body">
    <p class="section-label">Public</p>

    <div class="cards">

      <a class="card card-receitas" href="https://pragostin.github.io/receitas/" target="_blank">
        <div class="card-icon">🍳</div>
        <div class="card-body">
          <div class="card-title">Receitas</div>
          <div class="card-desc">Caderno de receitas da família</div>
        </div>
        <div class="card-arrow">›</div>
      </a>

      <a class="card card-hsd" href="https://high-speed-design.vercel.app" target="_blank">
        <div class="card-icon">⚡</div>
        <div class="card-body">
          <div class="card-title">High-Speed Design</div>
          <div class="card-desc">Personal knowledge base on IC design</div>
        </div>
        <div class="card-arrow">›</div>
      </a>

      <a class="card card-security" href="https://digital-security-nu.vercel.app" target="_blank">
        <div class="card-icon">⌾</div>
        <div class="card-body">
          <div class="card-title">Digital Security</div>
          <div class="card-desc">Cybersecurity, cloud hosting, and privacy notes</div>
        </div>
        <div class="card-arrow">›</div>
      </a>

    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

</body>
</html>
