<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peterson</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Peterson">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180x180.png">
  <link rel="icon" href="icons/favicon.ico" sizes="48x48">
  <link rel="icon" href="icons/icon.svg" sizes="any" type="image/svg+xml">
  <meta name="theme-color" content="#080808">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080808;
      --surface:  #111111;
      --border:   #1e1e1e;
      --text:     #f0f0f0;
      --muted:    #666;
      --subtle:   #2a2a2a;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 24px 64px;
    }

    /* ── HEADER ───────────────────────────── */
    header {
      max-width: 480px;
      margin: 0 auto 48px;
    }

    .label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(36px, 8vw, 52px);
      font-weight: 700;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── DIVIDER ──────────────────────────── */
    .divider {
      max-width: 480px;
      margin: 0 auto 32px;
      height: 1px;
      background: var(--border);
    }

    /* ── SECTION LABEL ────────────────────── */
    .section-label {
      max-width: 480px;
      margin: 0 auto 16px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── CARDS ────────────────────────────── */
    .cards {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .card:active {
      transform: scale(0.98);
    }

    @media (hover: hover) {
      .card:hover {
        background: var(--subtle);
        border-color: #333;
      }
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }

    .card-arrow {
      color: var(--muted);
      flex-shrink: 0;
      font-size: 18px;
    }

    /* card accent colors */
    .card-receitas .card-icon  { background: #1f0e00; color: #c4663a; }
    .card-hsd .card-icon       { background: #00101a; color: #47bfff; }
  </style>
</head>
<body>

  <header>
    <p class="label">Projects</p>
    <h1>Peterson</h1>
    <p class="subtitle">A collection of personal projects — tools, references, and experiments.</p>
  </header>

  <div class="divider"></div>

  <p class="section-label">Public</p>

  <div class="cards">

    <a class="card card-receitas" href="https://pragostin.github.io/receitas/" target="_blank">
      <div class="card-icon">🍳</div>
      <div class="card-body">
        <div class="card-title">Receitas</div>
        <div class="card-desc">Caderno de receitas da família</div>
      </div>
      <div class="card-arrow">›</div>
    </a>

    <a class="card card-hsd" href="https://high-speed-design.vercel.app" target="_blank">
      <div class="card-icon">⚡</div>
      <div class="card-body">
        <div class="card-title">High-Speed Design</div>
        <div class="card-desc">Personal knowledge base on IC design</div>
      </div>
      <div class="card-arrow">›</div>
    </a>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

</body>
</html>
